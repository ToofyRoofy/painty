<script id="mm-utils">
/* ============================================================
   mm-utils.js — Shared helpers for all Mind Map modules
   يتحمّل هذا الملف أولًا قبل أي ملف mm-*.js تاني.
   كان فيه نفس الدالتين دول متكررين 6 مرات في الكود القديم
   (مرة في كل باتش) — دلوقتي مرة واحدة بس.
   ============================================================ */
(function () {
  'use strict';
  window.MM = window.MM || {};

  // إنشاء عنصر DOM بسرعة: $('div', {id:'x'}, '<b>html</b>')
  window.MM.$ = function (t, p, h) {
    const e = document.createElement(t);
    if (p) Object.assign(e, p);
    if (h != null) e.innerHTML = h;
    return e;
  };

  // تهريب نص لعرضه كـ HTML بأمان
  window.MM.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  };

  // نص عادي من HTML (المعادلات بترجع نصها الأصلي) — كان مكرر بحروفه في engine/metadata/panels
  window.MM.strip = function (h) { const d = document.createElement('div'); d.innerHTML = h || ''; d.querySelectorAll('[data-mmeq]').forEach(q => q.replaceWith(document.createTextNode(q.getAttribute('data-mmeq') || ''))); return (d.innerText || d.textContent || '').trim(); };

  // قراءة ملف كـ Data URL — كان مكرر بحروفه في engine/metadata
  window.MM.readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

  // رابط خارجي صالح (نفس شرط الـhref في Rich Note: http/https/mailto بس — مفيش javascript:)
  window.MM.okUrl = v => /^(https?:|mailto:)/i.test(String(v == null ? '' : v).trim());
})();
</script>

    const tools = [['child', '＋ فرع'], ['sibling', '＋ شقيق'], ['rename', '✎'], ['dup', '⧉ نسخ الفرع'], ['del', '🗑 حذف'], ['fold', '▾▸ طيّ'], ['up', '↑'], ['down', '↓'], ['indent', '⇥ إزاحة'], ['outdent', '⇤ إخراج'], ['link', '🔗 ربط'], ['undo', '↶'], ['redo', '↷']];
    const tab = document.body.appendChild($('div', { id: 'mmTab', tabIndex: -1 }, `<div id="mmHead"><div class="mmTop"><span class="mmT on">Mind Map</span>

<div class="mmMain"><div id="mmSide"></div><div id="mmBody"><canvas id="mmCv"></canvas></div><div id="mmInsp"></div></div>`));
    const q = s => tab.querySelector(s), mmSearch = q('#mmSearch'), mmLay = q('#mmLay'), mmSide = q('#mmSide'), mmInsp = q('#mmInsp'), mmCv = q('#mmCv'), mmBody = q('#mmBody');
    mmSide.classList.toggle('hide', !S.side); mmInsp.classList.toggle('hide', !S.insp);
    /* FIX (Inspector audit): insp() فيما بعد كان بيكتب مباشرة على mmInsp.innerHTML

        '<div>' + (d.links || []).map((l, i) => '<div class="mmRow">' + (l.kind === 'int' ? '↪ ' + esc((C.get(l.ref) || { data: {} }).data.title || l.ref) : (window.MM.okUrl && window.MM.okUrl(l.url) ? '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.url) + '</a>' : esc(l.url))) + '<b data-a="rmlink" data-i="' + i + '">×</b></div>').join('') + '<input data-a="addlink" placeholder="رابط خارجي أو #عقدة + Enter"></div>' +
        '<div>' + (d.attachments || []).map(a => '<div class="mmRow">📎 ' + esc(a.name) + '</div>').join('') + '<input data-a="addatt" placeholder="مرفق/مرجع: الاسم|الرابط + Enter"></div>'; }

    /* ---------- Group: Search ---------- */
    function doSearch() { let s = mmSearch.value.trim(), f = {}; const m = /^#(\S+)\s*(.*)$/.exec(s); if (m) { const t = K.tags().find(t => t.data.name.toLowerCase() === m[1].toLowerCase()); f.tag = t ? t.id : '__none'; s = m[2]; }
      S.hl = new Set(s || f.tag ? K.search(s, f).filter(o => o.space === 'mm').map(o => o.id) : []); sched(); }
    let raf = 0; const sched = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); const sg = C.rev + '|' + [...C.ui.sel].join() + '|' + S.hl.size; if (sg !== S.sig) { S.sig = sg; side(); insp(); } }); };

    function open() { const t = document.getElementById('workspaceTab_mindmap'); if (t) { t.click(); return; } openLegacyPopup(); }
    function close() { const t = document.getElementById('workspaceTab_canvas'); if (t) { t.click(); return; } closeLegacyPopup(); }

      if (t) { if (t.dataset.tab === 'canvas' || t.dataset.tab === 'ekts') { close(); if (t.dataset.tab === 'ekts') { const p = document.getElementById('ektsPanel'), b = document.getElementById('ektsToggleBtn'); if (p && b && !p.classList.contains('open')) b.click(); } } return; }
      const z = e.target.closest('[data-z]'); if (z) { const r = mmCv.getBoundingClientRect(); C.zoomAt(r.width / 2, r.height / 2, +z.dataset.z); return; }

    mmSearch.addEventListener('input', doSearch);
    /* Outline: كل أحداث #mmSide بقت جوه Group: Outline في mm-panels.js (Delegation واحد) */
    mmInsp.addEventListener('change', e => { const f = e.target.dataset.f, o = sel1(); if (!f || !o) return; const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if (f === 'title') title(o.id, v); else if (f === 'color') C.set(o.id, { 'data.color': v }, 'format'); else if (f === 'notes') K.note(o.id, v);

      else if (a === 'addatt') { const p = v.split('|'); K.attach(o.id, { name: p[0].trim(), kind: 'ref', ref: (p[1] || '').trim() }); }

    mmInsp.addEventListener('click', e => { const a = e.target.dataset.a, o = sel1(); if (!a || !o) return;
      if (a === 'rmtag') K.tagRemove(o.id, e.target.dataset.i); else if (a === 'rmlink') K.unlink(o.id, +e.target.dataset.i); else if (a === 'unlink') { C.remove(o.id); C.clear(); } insp(true); });
    tab.addEventListener('keydown', e => { e.stopPropagation(); if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return; const k = e.key;
      if (e.ctrlKey && e.code === 'KeyZ') { e.preventDefault(); C.undo(true); } else if (e.ctrlKey && e.code === 'KeyY') { e.preventDefault(); C.redo(true); }

    /* مفيش dblclick هنا: الضغط مرتين على عقدة بيفتح محرر العقدة الحديث (nodeEditor) من listener الـengine، فمنضيفش rename box قديم يتعارض معاه. */
    C.attach(mmCv); if (window.ResizeObserver) new ResizeObserver(resize).observe(mmCv);

    if (eb) { const mk2 = (ic, tx, ti, f) => { const b = $('button', { type: 'button', className: eb.className, title: ti }, ic + '<span>' + tx + '</span>'); b.onclick = f; eb.insertAdjacentElement('afterend', b); }; mk2('🧠', 'خريطة', 'خريطة ذهنية', open); }
    else { const b = $('button', { type: 'button', textContent: '🧠', title: 'خريطة ذهنية' }); Object.assign(b.style, { position: 'fixed', left: '8px', bottom: '8px', zIndex: 40 }); b.onclick = open; document.body.appendChild(b); }

    /* ---------- تعريض الأساسيات للملفات الجاية بعد كده ---------- */
    Object.assign(window.MM, {
      C, K, S, V, ord, nodes, ch, roots, sib, hid, sizeOf, sel1, sn, port, edge,
      add, title, addSel, mv, mvNode, lay, fit, A, tab, mmSearch, mmLay, mmSide, mmInsp, mmCv, mmBody,
      ren, draw, resize, side, insp, doSearch, sched, open, close, openLegacyPopup, closeLegacyPopup
    });
  } catch (e) { console.error('mm-core:', e); }
})();

<script id="mm-selection">
/* ============================================================
   mm-selection.js
   يحمّل بعد mm-core.js وقبل mm-engine.js (لأن mm-engine.js بيقرا
   window.EKTSMindMapBatch2.focus اللي الملف ده بيعرّفه).

   الجروبات جوه الملف ده:
   - Multi-select
   - Focus Mode              (هي النسخة الوحيدة اللي فعليًا بتتعرض بصريًا
                              — mm-engine.js بيقرا حالتها في paint())
   - Markers (شريط سياقي)     (نسخة تانية غير v2، لسه شغالة وموصولة بزرار
                              حقيقي — سايباها لأنها متوافقة في البيانات
                              مع نسخة v2، مش متعارضة)
   - Expand All / Collapse All (نسخة batch2 — دي الموصولة فعليًا بزرار
                              توليبار حقيقي، عكس نسخة final-precision-patch
                              اللي موصولة بقائمة "More" بس)
   - Boundary + Summary       (تسجيل النوعين + إنشاءهم + شريط تعديل
                              خصائصهم العائم)

   ملاحظة: batch2 الأصلي كان بيلف paint بتاع mindnode/mindlink بتاعه
   بتاع الوقت ده (PLAN5) عشان يضيف تعتيم الفوكس والـmarkers فوقه. الكود
   ده اتشال من هنا عمدًا لأن mm-engine.js بيسجل paint تاني بعد كده
   بنفس الاسم وهيمسح أي حاجة هنا خالص — تركه كان هيبقى كود ميت بس
   بيستهلك وقت تنفيذ من غير أي تأثير على الشاشة.
   ============================================================ */
(function () {
  'use strict';
  const C = window.EKTSCore; if (!C) return;
  const $ = window.MM.$, esc = window.MM.esc;
  const tab = document.getElementById('mmTab'), tools = tab && tab.querySelector('.mmTools'), body = tab && document.getElementById('mmBody'), cv = tab && document.getElementById('mmCv');
  if (!C || !tools || !body || !cv || !C.types.mindnode) return;

  try {
    const nodes = () => C.byType('mindnode'), kids = id => nodes().filter(n => n.parent === id);
    const desc = (id, a) => { a = a || new Set([id]); kids(id).forEach(k => { if (!a.has(k.id)) { a.add(k.id); desc(k.id, a); } }); return a; };
    const selN = () => [...C.ui.sel].map(i => C.get(i)).filter(o => o && o.type === 'mindnode');
    const sel1 = () => { const a = [...C.ui.sel]; return a.length === 1 ? C.get(a[0]) : null; };
    const members = o => (o.data.ids || []).map(i => C.get(i)).filter(n => n && n.type === 'mindnode');
    const uni = L => { if (!L.length) return null; let a = 1 / 0, b = 1 / 0, c = -1 / 0, d = -1 / 0; L.forEach(k => { a = Math.min(a, k.x); b = Math.min(b, k.y); c = Math.max(c, k.x + k.w); d = Math.max(d, k.y + k.h); }); return { x: a, y: b, w: c - a, h: d - b }; };
    const rr = (c, r) => { c.beginPath(); if (c.roundRect) c.roundRect(r.x, r.y, r.w, r.h, 12); else c.rect(r.x, r.y, r.w, r.h); };

    /* ---------- Group: Focus (الحية) ---------- */
    const F = { on: false, set: new Set() };
    const dimK = ids => !F.on || (ids || []).some(i => F.set.has(i)) ? 1 : .18;

    /* ---------- Group: Markers (شريط سياقي) ---------- */
    const MK = { important: '❗', question: '❓', warning: '⚠️', done: '✅', star: '⭐', idea: '💡', priority: '🚩', happy: '😊', sad: '😞', error: '❌', start: '▶️', end: '⏹️' };
    const MKN = { important: 'مهم', question: 'سؤال', warning: 'تحذير', done: 'تم', star: 'نجمة', idea: 'فكرة', priority: 'أولوية', happy: 'سعيد', sad: 'حزين', error: 'خطأ', start: 'بداية', end: 'نهاية' };

    /* ---------- Group: Boundary + Summary ---------- */
    const brect = o => { const ids = o.data.ids || [], m = ids.map(id => C.get(id)).filter(Boolean); if (!m.length) return { x: o.x, y: o.y, w: o.w, h: o.h };
      if (o.data.autoFit === false) return Object.assign({ x: o.x, y: o.y, w: o.w || 220, h: o.h || 120 }, o.data.manualRect || {});
      const u = uni(m); if (!u) return null; const p = +o.data.pad || 16; return { x: u.x - p, y: u.y - p - 14, w: u.w + 2 * p, h: u.h + 2 * p + 14 }; };
    C.registerType('mmbound', {
      derived: true, defaults: { box: { w: 0, h: 0 }, data: { ids: [], label: 'مجموعة', color: '#1a73e8', opacity: .12, pad: 16, style: 'dashed' } },
      bounds: o => brect(o) || { x: o.x, y: o.y, w: 0, h: 0 },
      hit: (o, x, y, t) => { const r = brect(o); if (!r || x < r.x - t || x > r.x + r.w + t || y < r.y - t || y > r.y + r.h + t) return false; const e = Math.max(t, 8); return x < r.x + e || x > r.x + r.w - e || y < r.y + e || y > r.y + r.h - e || y < r.y + 24; },
      paint: (c, o, ui) => { const r = brect(o); if (!r) return; const d = o.data, col = d.color || '#1a73e8', k = dimK(d.ids);
        c.globalAlpha = k * (d.opacity == null ? .12 : d.opacity); c.fillStyle = col; rr(c, r); c.fill();
        c.globalAlpha = k; c.strokeStyle = col; c.lineWidth = ui.sel.has(o.id) ? 3 : 1.5; c.setLineDash(d.style === 'solid' ? [] : [8, 5]); rr(c, r); c.stroke(); c.setLineDash([]);
        if (d.label) { c.fillStyle = col; c.font = 'bold 13px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(d.label, r.x + 8, r.y + 6); } c.globalAlpha = 1; }
    });
    C.registerType('mmsummary', {
      derived: true, defaults: { box: { w: 0, h: 0 }, data: { ids: [], text: 'ملخص', color: '#e5484d' } },
      bounds: o => { if (o.data.manual) return { x: o.data.x || o.x, y: o.data.y || o.y, w: 180, h: 40 }; const u = uni(members(o)); return u ? { x: u.x + u.w + 10, y: u.y, w: 140, h: u.h } : { x: o.x, y: o.y, w: 0, h: 0 }; },
      hit: (o, x, y, t) => { if (o.data.manual) { const r = { x: o.data.x || o.x, y: o.data.y || o.y, w: 180, h: 40 }; return x >= r.x - t && x <= r.x + r.w + t && y >= r.y - t && y <= r.y + r.h + t; } const u = uni(members(o)); if (!u) return false; const bx = u.x + u.w + 10; return x >= bx - t && x <= bx + 140 + t && y >= u.y - t && y <= u.y + u.h + t; },
      paint: (c, o, ui) => { const u = uni(members(o)); if (!u) return; const d = o.data, col = d.color || '#e5484d', x = u.x + u.w + 12, y1 = u.y, y2 = u.y + u.h, m = (y1 + y2) / 2;
        c.globalAlpha = dimK(d.ids); c.strokeStyle = col; c.lineWidth = ui.sel.has(o.id) ? 3.5 : 2; c.beginPath(); c.moveTo(x, y1); c.quadraticCurveTo(x + 12, y1, x + 12, y1 + 12); c.lineTo(x + 12, m - 8);
        c.quadraticCurveTo(x + 12, m, x + 22, m); c.quadraticCurveTo(x + 12, m, x + 12, m + 8); c.lineTo(x + 12, y2 - 12); c.quadraticCurveTo(x + 12, y2, x, y2); c.stroke();
        c.fillStyle = col; c.font = 'bold 13px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(d.text || '', x + 30, m); c.globalAlpha = 1; }

<script id="mm-structure">
/* ============================================================
   mm-structure.js
   يحمّل بعد mm-engine.js وmm-panels.js (بيستخدم theme/docData/setDoc
   ودالة fit).

   الجروبات جوه الملف ده:
   - Structure Types  (نوع المخطط: Mind Map/Logic/Tree/Org/Timeline/
     Fishbone/Brace/Matrix/Tree Table) — بيغيّر شكل الترتيب مرة واحدة
   - Auto Layout presets (Radial/Horizontal/Vertical/Compact/Tree/
     Balanced) — قائمة منفصلة، خوارزميات مختلفة شوية عن اللي فوق.
     دول مش تكرار لبعض، هم فعليًا قايمتين مختلفتين في الكود الأصلي.

(function () {
  'use strict';
  const C = window.EKTSCore; if (!C) return;
  const $ = window.MM.$;
  const tab = document.getElementById('mmTab'); if (!tab || !window.MM.docData) return;

  try {
    const nodes = () => C.byType('mindnode'), kids = id => window.MM.ch ? window.MM.ch(id) : nodes().filter(n => n.parent === id), roots = () => window.MM.roots ? window.MM.roots() : nodes().filter(n => !n.parent || !C.get(n.parent)); /* الأشقاء بترتيب data.order (نفس ترتيب الـOutline) */
    const desc = id => window.MM.descM ? window.MM.descM(id).map(n => n.id) : kids(id).map(n => n.id);
    const docData = window.MM.docData, setDoc = window.MM.setDoc;
    const fitSet = ids => { const L = nodes().filter(n => ids.has(n.id)); if (!L.length) return; const cv = document.getElementById('mmCv'), r = cv.getBoundingClientRect(), x1 = Math.min(...L.map(n => n.x)), y1 = Math.min(...L.map(n => n.y)), x2 = Math.max(...L.map(n => n.x + n.w)), y2 = Math.max(...L.map(n => n.y + n.h));
      const z = Math.max(.2, Math.min(1.6, (r.width - 60) / (x2 - x1 || 1), (r.height - 60) / (y2 - y1 || 1))); C.ui.view.zoom = z; C.ui.view.x = (r.width - (x2 - x1) * z) / 2 - x1 * z; C.ui.view.y = (r.height - (y2 - y1) * z) / 2 - y1 * z; if (window.MM.drawRefresh) window.MM.drawRefresh(); };

    /* ---------- Group: Structure Types ---------- */
    function autoLayout(mode) { mode = mode || docData().layout || 'manual'; if (mode === 'manual') return; const all = nodes(), P = new Map(), setP = (n, x, y) => P.set(n.id, { x, y });
      if (mode === 'radial' || mode === 'mindmap') { roots().forEach((r, ri) => { const branch = desc(r.id).map(id => C.get(id)), arr = [r].concat(branch), cx = ri * 1000 + 300, cy = 350; arr.forEach((n, i) => { if (n.id === r.id) return; const a = (i / Math.max(1, arr.length - 1)) * Math.PI * 2, radius = 160 + Math.floor(i / 6) * 120; setP(n, cx + Math.cos(a) * radius - n.w / 2, cy + Math.sin(a) * radius - n.h / 2); }); }); }
      else if (mode === 'timeline') { const a = all.slice().sort((x, y) => (x.data.order || 0) - (y.data.order || 0)); a.forEach((n, i) => setP(n, 100 + i * 200, 220 + (i % 2) * 100)); }
      else if (mode === 'matrix' || mode === 'treeTable') { all.forEach((n, i) => setP(n, 100 + (i % 5) * 180, 100 + Math.floor(i / 5) * 100)); }
      else if (mode === 'fishbone') { all.forEach((n, i) => { const p = n.parent && C.get(n.parent); if (!p) setP(n, 100, 250 + i * 120); else { const sib = kids(p.id).indexOf(n); setP(n, p.x + 220, p.y + (sib - (kids(p.id).length - 1) / 2) * 90); } }); }

      else { let y = 80; all.forEach((n, i) => setP(n, 80 + (i % 4) * 220, y + Math.floor(i / 4) * 90)); }

    function openStructureMenu() { const m = $('div', { id: 'mmStructureMenu' }); m.style.cssText = 'position:fixed;z-index:1700;top:96px;right:140px;background:#fff;border:1px solid #aaa;border-radius:8px;box-shadow:0 4px 18px #0003;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px';
      [['mindmap', 'Mind Map'], ['logic', 'Logic Chart'], ['tree', 'Tree'], ['org', 'Organization'], ['timeline', 'Timeline'], ['fishbone', 'Fishbone'], ['brace', 'Brace Map'], ['matrix', 'Matrix'], ['treeTable', 'Tree Table']].forEach(([k, l]) => { const b = $('button', { type: 'button', textContent: l }); b.onclick = () => { setDoc({ structure: k, layout: k }, 'structure'); autoLayout(k); m.remove(); }; m.appendChild(b); });
      document.body.appendChild(m); }

    /* ---------- Group: Auto Layout presets (قائمة تانية، خوارزميات مختلفة) ---------- */

      else if (mode === 'horizontal' || mode === 'vertical') { const axis = mode === 'horizontal'; let cursor = 0; const visit = (n, depth) => { const k = orderedKids(n.id); if (!n.locked) { if (axis) P.set(n.id, { x: 100 + depth * 220, y: 80 + cursor * 70 }); else P.set(n.id, { x: 80 + cursor * 180, y: 60 + depth * 100 }); } cursor += 1; k.forEach(c => visit(c, depth + 1)); }; roots().forEach(r => visit(r, 0)); }
      else if (mode === 'compact') { free.forEach((n, i) => P.set(n.id, { x: 80 + (i % 6) * 160, y: 70 + Math.floor(i / 6) * 80 })); }
      else if (mode === 'tree') { let y = 80; const visit = (n, depth) => { if (!n.locked) P.set(n.id, { x: 80 + depth * 220, y }); y += 65; orderedKids(n.id).forEach(c => visit(c, depth + 1)); }; roots().forEach(r => visit(r, 0)); }
      else { const place = (n, depth, top, bottom) => { const ks = orderedKids(n.id), mid = (top + bottom) / 2; if (!n.locked) P.set(n.id, { x: 80 + depth * 220, y: mid - n.h / 2 }); if (!ks.length) return; const step = (bottom - top) / ks.length; ks.forEach((c, i) => place(c, depth + 1, top + i * step, bottom - (ks.length - i - 1) * step)); }; let top = 80; roots().forEach(r => { const span = Math.max(80, orderedKids(r.id).length * 70); place(r, 0, top, top + span); top += span + 40; }); }

    function openAutoLayoutMenu() { const m = $('div', { id: 'mmAutoLayoutMenu' }); m.style.cssText = 'position:fixed;z-index:1710;top:96px;right:290px;background:#fff;border:1px solid #aaa;border-radius:8px;box-shadow:0 6px 20px #0003;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:230px;direction:ltr';
      [['radial', 'Radial'], ['horizontal', 'Horizontal'], ['vertical', 'Vertical'], ['compact', 'Compact'], ['tree', 'Tree'], ['balanced', 'Balanced']].forEach(([k, l]) => { const b = $('button', { type: 'button', textContent: l }); b.onclick = () => { applyAutoLayoutPreset(k); m.remove(); }; m.appendChild(b); });
      document.body.appendChild(m); }

    Object.assign(window.MM, { openStructureMenu, openAutoLayoutMenu, autoLayout, applyAutoLayoutPreset });
  } catch (e) { console.error('mm-structure:', e); }
})();

          else if (k === 'collapseall') window.MM.collapseAll && window.MM.collapseAll(); else if (k === 'expandall') window.MM.expandAll && window.MM.expandAll(); else if (k === 'note' && n) window.MM.openNote2 && window.MM.openNote2(n.id);
          m.remove(); }; m.appendChild(b); }); document.body.appendChild(m); }

<script id="mm-paint-bridge">
/* =====================================================================
 * MM PAINT BRIDGE — ربط الـMind Map بمحرر Paint (paint-EKTS-workspace.html)
 *
 * كليك يمين على أي صورة (عقدة أو Rich Note) ← "🎨 تعديل في Paint" ← يفتح Paint
 * جوه نافذة كاملة (iframe) بنفس شكله. "تطبيق" بيرجّع:
 *   - png  : الصورة النهائية مسطّحة (رسم + مكونات كهربية) ← بتحل محل src في الـMind Map
 *   - project : مشروع Paint كامل (.ektsproj: الخطوط + الدوائر + الصفحة) ← بيتحفظ مع الصورة
 *               (data.images[i].proj / data.noteImgs[i].proj) فلما تفتحها تاني ترجع قابلة للتعديل
 *   - pv   : بصمة الـpng اللي المشروع اتحفظ عليها. لو الصورة اتغيّرت من برّه (Replace/Rotate)
 *            البصمة مش هتطابق ← الصورة بتفتح كصورة عادية بدل مشروع قديم متضارب.
 *
 * البروتوكول (postMessage — بيتفحص e.source === iframe.contentWindow):
 *   Paint → MM : ekts-paint-ready | ekts-paint-opened | ekts-paint-open-error | ekts-paint-dirty | ekts-paint-snapshot
 *   MM → Paint : ekts-paint-open {project|image} | ekts-paint-request {id}
 * مكان ملف Paint: window.MM_PAINT_URL  أو  <meta name="mm-paint-url" content="...">  أو الافتراضي جنب الملف ده.
 * ===================================================================== */
(function () {
  'use strict';
  window.MM = window.MM || {};
  window.MM_hash = function (s) { s = String(s || ''); let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return s.length + ':' + (h >>> 0).toString(36); };

  const paintUrl = () => window.MM_PAINT_URL || ((document.querySelector('meta[name="mm-paint-url"]') || {}).content) || 'paint-EKTS-workspace.html';
  let ov = null, frame = null, msgEl = null, stateEl = null, S = null, seq = 0;

  const css = '#mmPaintOv{position:fixed;inset:0;z-index:6000;display:none;flex-direction:column;background:#f5f6f8;direction:rtl;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}' +
    '#mmPaintOv .pbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f6f8fc;border-bottom:1px solid rgba(110,130,170,.22);color:#1d2330;font-size:13px}' +
    '#mmPaintOv .pbar strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}' +
    '#mmPaintOv .pbar .sp{flex:1}' +
    '#mmPaintOv .pbar .st{font-size:12px;color:#8b97ab;font-weight:600}' +
    '#mmPaintOv .pbar button{border:1px solid rgba(110,130,170,.22);background:linear-gradient(#fff,#eef3fb);color:#2a3a58;border-radius:12px;height:36px;padding:0 15px;cursor:pointer;font:600 13px system-ui,"Segoe UI",Tahoma,sans-serif;box-shadow:0 1px 2px rgba(40,60,100,.07),0 4px 14px -4px rgba(40,60,100,.14)}' +
    '#mmPaintOv .pbar button:hover{background:linear-gradient(#fff,#e3ecfb);border-color:rgba(110,130,170,.35)}' +
    '#mmPaintOv .pbar button.pri{background:#1a73e8;border-color:#1a73e8;color:#fff;box-shadow:0 4px 14px -4px rgba(26,115,232,.55)}' +
    '#mmPaintOv .pbar button.pri:hover{background:#2b83f0}' +
    '#mmPaintOv .pbar button:disabled{background:#ecf0f5;color:#8b97ab;border-color:#dde3ec;box-shadow:none;cursor:default}' +
    '#mmPaintOv .pbody{position:relative;flex:1 1 auto;min-height:0}' +
    '#mmPaintOv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f6f8}' +
    '#mmPaintOv .pmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#2a3a58;font-size:14px;line-height:1.8;background:#f5f6f8;white-space:pre-line}' +
    '#mmPaintOv .pmsg[hidden]{display:none}';

  function build() {
    if (ov) return;
    const st = document.createElement('style'); st.id = 'mmPaintOvStyle'; st.textContent = css; document.head.appendChild(st);
    ov = document.createElement('div'); ov.id = 'mmPaintOv'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Paint');
    ov.innerHTML = '<div class="pbar"><strong id="mmPaintTitle">🎨 Paint</strong><span class="st" id="mmPaintState"></span><span class="sp"></span>' +
      '<button type="button" data-a="apply" title="يحط التعديلات في الـMind Map ويفضل Paint مفتوح">💾 تطبيق</button>' +
      '<button type="button" data-a="done" class="pri" title="يحط التعديلات في الـMind Map ويقفل">✓ تطبيق وإغلاق</button>' +
      '<button type="button" data-a="cancel" title="إغلاق">✕ إغلاق</button></div>' +
      '<div class="pbody"><iframe id="mmPaintFrame" title="Paint"></iframe><div class="pmsg" id="mmPaintMsg"></div></div>';
    document.body.appendChild(ov);
    frame = ov.querySelector('#mmPaintFrame'); msgEl = ov.querySelector('#mmPaintMsg'); stateEl = ov.querySelector('#mmPaintState');
    ov.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button[data-a]'); if (!b || b.disabled) return; onBtn(b.dataset.a, b); });
    ov.addEventListener('keydown', e => e.stopPropagation()); /* مفاتيح Paint ما توصلش لاختصارات الـMind Map */
  }

  const post = m => { try { frame.contentWindow.postMessage(m, '*'); } catch (_) {} };
  const setState = t => { if (stateEl) stateEl.textContent = t || ''; };
  const busy = on => ov.querySelectorAll('.pbar button').forEach(b => { b.disabled = on; });

  async function toDataUrl(src) {
    if (/^data:image\//i.test(src)) return src;
    try { const r = await fetch(src, { mode: 'cors' }); if (!r.ok) throw 0; const b = await r.blob();
      return await new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); }); } catch (_) { return null; }
  }

  function snap() {
    return new Promise((res, rej) => {
      const id = ++seq, t = setTimeout(() => { S && S.pending.delete(id); rej(new Error('Paint مردّش (timeout).')); }, 30000);
      S.pending.set(id, m => { clearTimeout(t); m.error ? rej(new Error(m.error)) : res(m); }); post({ t: 'ekts-paint-request', id });
    });
  }
  async function applyNow() {
    const m = await snap();
    const ok = S.opts.onApply({ png: m.png, project: m.project, w: m.w, h: m.h });
    if (ok === false) throw new Error('الصورة اتغيّرت أو اتحذفت من الـMind Map، مقدرتش أطبّق التعديل.');
    S.dirty = false; setState('✓ اتطبّق ' + new Date().toLocaleTimeString());
  }
  function closeNow() {
    if (!S) return; clearTimeout(S.timer); S = null; try { frame.src = 'about:blank'; } catch (_) {} ov.style.display = 'none'; setState('');
  }
  async function onBtn(a) {
    if (!S) return;
    try {
      if (a === 'apply') { busy(true); setState('جاري التطبيق…'); await applyNow(); }
      else if (a === 'done') { busy(true); setState('جاري التطبيق…'); await applyNow(); closeNow(); }
      else if (a === 'cancel') {
        if (S.dirty && S.ready) {
          if (confirm('فيه تعديلات لسه ما اتطبّقتش على الـMind Map.\n\n[موافق] تطبيق التعديلات وإغلاق\n[إلغاء] خيارات تانية')) { busy(true); await applyNow(); closeNow(); }
          else if (confirm('تجاهل التعديلات وإغلاق Paint بدون تطبيق؟')) closeNow();
        } else closeNow();
      }
    } catch (err) { alert('تعذر التطبيق:\n' + (err && err.message || err)); setState('فشل التطبيق'); }
    finally { if (S) busy(false); }
  }

  window.addEventListener('message', e => {
    if (!S || !frame || e.source !== frame.contentWindow) return; const m = e.data; if (!m || typeof m.t !== 'string') return;
    if (m.t === 'ekts-paint-ready') { S.ready = true; post({ t: 'ekts-paint-open', project: S.opts.project || null, image: S.dataUrl || null, title: S.opts.title || '' }); }
    else if (m.t === 'ekts-paint-opened') { clearTimeout(S.timer); msgEl.hidden = true; setState(S.opts.project ? 'مشروع محفوظ اتفتح' : ''); }
    else if (m.t === 'ekts-paint-open-error') { alert('تعذر فتح الصورة في Paint:\n' + (m.error || '')); closeNow(); }
    else if (m.t === 'ekts-paint-dirty') { S.dirty = !!m.dirty; if (S.dirty) setState('● فيه تعديلات لسه ما اتطبّقتش'); }
    else if (m.t === 'ekts-paint-snapshot') { const cb = S.pending.get(m.id); if (cb) { S.pending.delete(m.id); cb(m); } }
  });

  async function open(opts) {
    if (S) return; /* نافذة واحدة في كل مرة */
    const dataUrl = opts.src ? await toDataUrl(opts.src) : null;
    if (!dataUrl) { alert('الصورة دي مصدرها رابط خارجي مش بيسمح بالتعديل (CORS). نزّلها وأضفها كملف.'); return; }
    build(); S = { opts, dataUrl, ready: false, dirty: false, pending: new Map(), timer: 0 };
    ov.querySelector('#mmPaintTitle').textContent = '🎨 ' + (opts.title || 'Paint'); setState(''); busy(false);
    msgEl.hidden = false; msgEl.textContent = 'جاري تحميل Paint…'; ov.style.display = 'flex';
    S.timer = setTimeout(() => { if (S && !S.ready) msgEl.textContent = 'مش قادر أحمّل Paint.\nتأكد إن الملف  ' + paintUrl() + '  موجود جنب ملف الـMind Map في نفس الفولدر (أو نفس الـrepo).'; }, 8000);
    const u = paintUrl(); frame.src = u + (u.indexOf('?') < 0 ? '?' : '&') + 'embed=1';
  }

  window.MM.paintEdit = { open, get active() { return !!S; } };
})();
</script>
<script id="mm-bootstrap">
(function () {
'use strict';
const C = window.EKTSCore;
/* المفتاح القديم: بقى مصدر هجرة (migration) بس. مبنكتبش عليه تاني ومبنمسحوش أبدًا. */
const AUTOSAVE_KEY = 'mm_standalone_autosave_v1';
const LEGACY_ID = 'p_legacy_autosave_v1';
const DB_NAME = 'mm_projects', DB_VER = 1;

const el = (tag, props, text) => { const e = document.createElement(tag); if (props) Object.assign(e, props); if (text != null) e.textContent = text; return e; };
const cleanName = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 80);
const EMPTY = () => ({ schema: 1, app: 'mindmap', objects: [] });

/* =====================================================================
   PROJECT STORAGE (IndexedDB)
   meta : { id, name, createdAt, updatedAt, nodeCount, objCount }   ← الشاشة بتقرا ده بس
   data : { id, data: <C.serialize()>, savedAt }                    ← بيتحمّل لمشروع واحد بس عند الفتح
   kv   : { k, v }  (lastProjectId, legacyMigrated)
   كل كتابة = transaction واحدة على meta+data → يا كله يتكتب يا مفيش (النسخة القديمة الصالحة مبتتدمرش).
   ===================================================================== */
let db = null;
function openDB() { return new Promise((res, rej) => {
  if (!window.indexedDB) return rej(new Error('IndexedDB غير متاح في هذا المتصفح'));
  let r; try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return rej(e); }
  r.onupgradeneeded = () => { const d = r.result;
    if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
    if (!d.objectStoreNames.contains('data')) d.createObjectStore('data', { keyPath: 'id' });
    if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' }); };
  r.onsuccess = () => { db = r.result; db.onversionchange = () => { try { db.close(); } catch (e) {} db = null; }; res(db); };
  r.onerror = () => rej(r.error || new Error('فشل فتح قاعدة البيانات'));
  r.onblocked = () => rej(new Error('قاعدة البيانات مقفولة بواسطة تبويب آخر'));
}); }
/* work(tx, set) لازم يستخدم callbacks بس (من غير await) عشان الـtransaction متقفلش بدري. الـPromise executor بيشتغل synchronously
   → الـtransaction بتبدأ في نفس اللحظة (مهم لـpagehide). */
function txp(stores, mode, work) { return new Promise((res, rej) => {
  if (!db) return rej(new Error('التخزين غير متاح'));
  let t, out; try { t = db.transaction(stores, mode); } catch (e) { return rej(e); }
  t.oncomplete = () => res(out);
  t.onabort = () => rej(t.__err || t.error || new Error('أُلغيت عملية التخزين'));
  t.onerror = () => {};
  try { work(t, v => { out = v; }); } catch (e) { t.__err = e; try { t.abort(); } catch (_) {} }
}); }
function validateData(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.objects)) return 'بيانات المشروع غير صالحة';
  const ids = new Set();
  for (const o of d.objects) { if (!o || typeof o !== 'object' || typeof o.id !== 'string' || typeof o.type !== 'string') return 'يوجد عنصر غير صالح داخل المشروع';
    if (ids.has(o.id)) return 'معرّف مكرر داخل المشروع: ' + o.id; ids.add(o.id); }
  return null;
}
const countNodes = d => d.objects.filter(o => o.type === 'mindnode').length;
const newId = () => 'p_' + ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)));
const Store = {
  listMeta() { return txp(['meta'], 'readonly', (t, set) => { const r = t.objectStore('meta').getAll(); r.onsuccess = () => set(r.result || []); }); },
  loadProject(id) { return txp(['meta', 'data'], 'readonly', (t, set) => { let m, d; const a = t.objectStore('meta').get(id), b = t.objectStore('data').get(id);
    a.onsuccess = () => { m = a.result; }; b.onsuccess = () => { d = b.result; set({ meta: m, data: d ? d.data : null }); }; }); },
  putNew(meta, data) { return txp(['meta', 'data'], 'readwrite', (t, set) => { t.objectStore('data').put({ id: meta.id, data, savedAt: meta.updatedAt }); t.objectStore('meta').put(meta); set(meta); }); },
  createProject(name, data) { const now = Date.now(), meta = { id: newId(), name, createdAt: now, updatedAt: now, nodeCount: countNodes(data), objCount: data.objects.length }; return Store.putNew(meta, data); },
  saveProject(id, data) { const objCount = data.objects.length, nodeCount = countNodes(data);
    return txp(['meta', 'data'], 'readwrite', (t, set) => { const ms = t.objectStore('meta'), ds = t.objectStore('data'), g = ms.get(id);
      g.onsuccess = () => { const m = g.result; if (!m) { set('missing'); return; }
        if (objCount === 0 && m.objCount > 0) { t.__err = new Error('تم رفض حفظ نسخة فارغة فوق مشروع يحتوي بيانات'); t.abort(); return; }
        const now = Date.now(); ds.put({ id, data, savedAt: now }); ms.put(Object.assign({}, m, { updatedAt: now, nodeCount, objCount })); set('ok'); }; }); },
  renameProject(id, name) { return txp(['meta'], 'readwrite', (t, set) => { const ms = t.objectStore('meta'), g = ms.get(id);
    g.onsuccess = () => { const m = g.result; if (!m) { set(false); return; } ms.put(Object.assign({}, m, { name })); set(true); }; }); },
  deleteProject(id) { return txp(['meta', 'data', 'kv'], 'readwrite', (t, set) => { t.objectStore('meta').delete(id); t.objectStore('data').delete(id);
    const kv = t.objectStore('kv'), g = kv.get('lastProjectId'); g.onsuccess = () => { if (g.result && g.result.v === id) kv.delete('lastProjectId'); }; set(true); }); },
  kvGet(k) { return txp(['kv'], 'readonly', (t, set) => { const r = t.objectStore('kv').get(k); r.onsuccess = () => set(r.result ? r.result.v : undefined); }); },
  kvSet(k, v) { return txp(['kv'], 'readwrite', (t, set) => { t.objectStore('kv').put({ k, v }); set(true); }); }
};

/* ---------- Migration من الـautosave القديم (مرة واحدة، من غير حذف للأصل) ---------- */
async function migrateLegacy() {
  if (await Store.kvGet('legacyMigrated')) return null;
  let raw; try { raw = localStorage.getItem(AUTOSAVE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let data; try { data = JSON.parse(raw); } catch (e) { return 'تعذر قراءة الحفظ القديم. البيانات القديمة لم تُمس ويمكن استرجاعها.'; }
  const err = validateData(data); if (err) return 'الحفظ القديم غير صالح (' + err + '). البيانات القديمة لم تُمس.';
  if (!data.objects.length) { await Store.kvSet('legacyMigrated', true); return null; }
  const existing = await Store.loadProject(LEGACY_ID);
  if (!existing.meta) {
    const doc = data.objects.find(o => o.type === 'mindmapdoc'), name = cleanName(doc && doc.data && doc.data.title) || 'مشروعي السابق', now = Date.now();
    await Store.putNew({ id: LEGACY_ID, name, createdAt: now, updatedAt: now, nodeCount: countNodes(data), objCount: data.objects.length }, data);
    const back = await Store.loadProject(LEGACY_ID);   /* تحقق فعلي إن الكتابة نجحت قبل ما نعتبر الهجرة تمت */
    if (!back.meta || !back.data || back.data.objects.length !== data.objects.length) return 'فشل التحقق من استيراد الحفظ القديم. البيانات القديمة لم تُمس.';
  }
  await Store.kvSet('legacyMigrated', true);
  return null;
}

/* =====================================================================
   UI: Saved Projects (بسيط)
   ===================================================================== */
const css = el('style', { id: 'pjStyle' }, `
#mmProjects{position:fixed;inset:0;z-index:5000;background:#f5f6f8;color:#222;font:15px system-ui,sans-serif;display:none;overflow:auto;-webkit-overflow-scrolling:touch}

.pjRow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;min-height:56px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.pjRow:hover,.pjRow:focus{border-color:#1a73e8;outline:0}
.pjRow.last{border-color:#1a73e8;background:#f2f7ff}

.pjSub{font-size:12px;color:#777;margin-top:3px}
.pjMore{border:0;background:none;font-size:22px;line-height:1;padding:8px 12px;cursor:pointer;color:#666;border-radius:8px}
.pjMore:hover{background:#eee}

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000); if (s < 60) return 'منذ قليل';
  const m = Math.floor(s / 60); if (m < 60) return m === 1 ? 'منذ دقيقة' : m === 2 ? 'منذ دقيقتين' : m <= 10 ? 'منذ ' + m + ' دقائق' : 'منذ ' + m + ' دقيقة';
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) { const h = Math.floor(m / 60); return h === 1 ? 'منذ ساعة' : h === 2 ? 'منذ ساعتين' : h <= 10 ? 'منذ ' + h + ' ساعات' : 'منذ ' + h + ' ساعة'; }
  const y = new Date(n); y.setDate(n.getDate() - 1); if (d.toDateString() === y.toDateString()) return 'أمس';
  return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
}

/* =====================================================================
   PROJECT LIFECYCLE
   ===================================================================== */
let currentId = null, loading = false, lastSavedRev = -1, saveTimer = 0, retryTimer = 0, busy = false;
window.__mmSaveError = false;
const refreshTopUI = () => { if (window.MM && window.MM.refreshTop) window.MM.refreshTop(); };
function setSaveError(msg) { const first = !window.__mmSaveError; window.__mmSaveError = true; if (first) toast(msg, true); refreshTopUI(); }
function clearSaveError() { if (window.__mmSaveError) { window.__mmSaveError = false; refreshTopUI(); } }
const errText = e => (e && e.name === 'QuotaExceededError') ? 'مساحة التخزين ممتلئة' : (e && e.message) || String(e);

function schedule() { if (!currentId || loading || C.rev === lastSavedRev) return; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
C.on(schedule);

/* بيبدأ الـtransaction synchronously (مهم لـpagehide) ويرجّع Promise<boolean>. */
function flush() {
  clearTimeout(saveTimer);
  if (!currentId || loading || C.rev === lastSavedRev) return Promise.resolve(true);
  const id = currentId, rev = C.rev; let data;
  try { data = C.serialize(); } catch (e) { setSaveError('فشل تجهيز بيانات الحفظ: ' + errText(e)); return Promise.resolve(false); }
  const bad = validateData(data); if (bad) { setSaveError('لم يتم الحفظ: ' + bad); return Promise.resolve(false); }
  return Store.saveProject(id, data).then(r => {
    if (r === 'missing') throw new Error('المشروع لم يعد موجودًا في التخزين');
    if (currentId === id) { lastSavedRev = Math.max(lastSavedRev, rev); window.__mmLastSavedRev = rev; clearSaveError(); refreshTopUI(); if (C.rev !== lastSavedRev) schedule(); }
    return true;
  }).catch(e => { setSaveError('فشل حفظ المشروع: ' + errText(e)); clearTimeout(retryTimer); retryTimer = setTimeout(() => { if (currentId === id) flush(); }, 5000); return false; });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', () => { flush(); });
window.addEventListener('beforeunload', e => { flush(); if (window.__mmSaveError && currentId) { e.preventDefault(); e.returnValue = ''; } });

async function leaveCurrent() { closeEditors(); if (await flush()) return true;
  return confirm('فشل حفظ المشروع الحالي. المتابعة قد تفقد آخر التعديلات غير المحفوظة. هل تريد المتابعة؟'); }

function enterProject(id, data) {
  loading = true;
  try {
    const M = window.MM; if (M.close) M.close();
    C.deserialize(data);
    if (C.list().length !== data.objects.length) throw new Error(C.lastError || 'تعذر تحميل كل عناصر المشروع');
    currentId = id; if (M.resetFocusState) M.resetFocusState(); if (M.S) M.S.fitted = 0; M.open(); hidePicker();
    lastSavedRev = C.rev; window.__mmLastSavedRev = C.rev; window.__mmSaveError = false; refreshTopUI();
  } catch (e) { currentId = null; try { C.deserialize(EMPTY()); } catch (_) {} showPicker(); throw e; }
  finally { loading = false; }
  Store.kvSet('lastProjectId', id).catch(() => {});
}
async function doOpen(id) {
  if (currentId && currentId !== id) { if (!(await leaveCurrent())) return; }
  let rec; try { rec = await Store.loadProject(id); } catch (e) { pickerError('تعذر قراءة المشروع: ' + errText(e)); return; }
  if (!rec.meta || !rec.data) { pickerError('المشروع غير موجود أو بياناته مفقودة.'); renderPicker(); return; }
  const bad = validateData(rec.data); if (bad) { pickerError('تعذر فتح «' + rec.meta.name + '»: ' + bad + ' (المشروع لم يُحذف).'); return; }
  try { enterProject(id, rec.data); } catch (e) { pickerError('تعذر فتح «' + rec.meta.name + '»: ' + errText(e) + ' (المشروع لم يُحذف).'); }
}

    window.__mmSaveError = false; showPicker(); await renderPicker();

}

if (titleInput) titleInput.addEventListener('change', () => { const n = cleanName(titleInput.value); if (currentId && n) Store.renameProject(currentId, n).catch(e => toast('تعذر تحديث اسم المشروع: ' + errText(e), true)); });

/* ---------- START ---------- */
showPicker(); pjList.appendChild(el('div', { className: 'pjEmpty' }, '…'));
(async function start() {
  try { await openDB(); } catch (e) { pjList.textContent = ''; pjNew.disabled = true; pickerError('التخزين الدائم غير متاح في هذا المتصفح، لذلك لا يمكن حفظ المشاريع: ' + errText(e)); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  let mig = null; try { mig = await migrateLegacy(); } catch (e) { mig = 'فشل استيراد الحفظ القديم: ' + errText(e) + ' (البيانات القديمة لم تُمس).'; }

})();
window.MMProjects = { openProject, goPicker, newProject, flush, Store, saveCopy };
})();
</script>

  };

    'x:focus': el => /إنهاء/.test(el.textContent) ? { name: 'إنهاء التركيز (Exit Focus)', use: 'يوقف وضع التركيز ويُظهر كل الخريطة بوضوح كامل.', info: 'متاح دائمًا أثناء التركيز.' } : null,

  /* ---------- Tooltip DOM واحد ---------- */
  const st = document.createElement('style');
  st.textContent = '#mmSmartTip{position:fixed;left:0;top:0;z-index:2400;display:none;box-sizing:border-box;max-width:min(260px,calc(100vw - 12px));width:max-content;padding:6px 9px;background:#1f2937;color:#f9fafb;border:1px solid rgba(255,255,255,.14);border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.28);font:12px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl;text-align:right;pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .12s ease,transform .12s ease,left .1s ease,top .1s ease}' +
    '#mmSmartTip.up{transform:translateY(2px)}#mmSmartTip.on{opacity:1;transform:translateY(0)}#mmSmartTip.nt{transition:none}' +
    '#mmSmartTip .n{font-weight:700;font-size:12.5px;color:#fff;overflow-wrap:anywhere}#mmSmartTip .u{margin-top:2px;overflow-wrap:anywhere}' +
    '#mmSmartTip .i{margin-top:3px;color:#cbd5e1;overflow-wrap:anywhere}#mmSmartTip .k{margin-top:3px;color:#cbd5e1}' +
    '#mmSmartTip kbd{display:inline-block;direction:ltr;unicode-bidi:isolate;font:11px/1.4 ui-monospace,Consolas,monospace;padding:0 5px;border:1px solid rgba(255,255,255,.3);border-radius:4px;background:rgba(255,255,255,.1);color:#fff}' +
    '#mmSmartTip .w{margin-top:3px;color:#fbbf24;overflow-wrap:anywhere}#mmSmartTip [hidden]{display:none}' +

  const $n = tip.querySelector('.n'), $u = tip.querySelector('.u'), $w = tip.querySelector('.w'), $i = tip.querySelector('.i'), $k = tip.querySelector('.k'), $kb = tip.querySelector('kbd');

  /* ---------- State + Timer واحد قابل للإلغاء ---------- */

      hov = null,      /* الأداة اللي الماوس فوقها (بنمنع title بتاعها) */

  /* منع Tooltip المتصفح (title): بنحفظ العنوان مؤقتًا ونرجّعه عند المغادرة/الضغط،

  const release = el => { if (el && el.dataset && 'ttT' in el.dataset) { if (!el.title) el.title = el.dataset.ttT; delete el.dataset.ttT; } };

    $n.textContent = k === 'mk' ? 'علامة: ' + (rawTitle || el.textContent.trim()) : d.name; $u.textContent = d.use;

    $w.hidden = !(off && rawTitle); $w.textContent = off && rawTitle ? 'غير متاح الآن: ' + rawTitle : '';
    $i.hidden = !d.info; $i.textContent = d.info ? 'معلومة: ' + d.info : '';
    $k.hidden = !d.keys; $kb.textContent = d.keys || '';

    const r = el.getBoundingClientRect(); if (!r.width && !r.height) return false;
    const vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight, gap = 6, m = 4;

    const left = Math.min(Math.max(cx - w / 2, m), Math.max(m, vw - w - m));
    let top = r.bottom + gap, up = false;                                    /* الافتراضي: أسفل الأداة */
    if (top + h > vh - m && r.top - gap - h >= m) { top = r.top - gap - h; up = true; } /* مفيش مساحة تحت → فوق */
    top = Math.max(m, Math.min(top, vh - h - m));

  }, true);
  document.addEventListener('pointermove', e => {                            /* أداة اتشالت/اتخفت أثناء الـhover */
    if (!shown || !cur) return;

  document.addEventListener('focusin', e => {

    const t = toolOf(e.target); if (!t) return;

  /* ---------- Hide rules ---------- */
  const settle = () => { clearTimeout(pressT); pressT = setTimeout(() => { pressed = false; if (hov && hov.isConnected) hold(hov); }, 60); };
  document.addEventListener('pointerdown', () => {                            /* click / drag / فتح modal: أخفي + رجّع title للكود الأصلي */
    lastPtr = performance.now(); pressed = true; clearTimeout(pressT); if (hov) release(hov); hide(); }, true);
  document.addEventListener('pointerup', settle, true);
  document.addEventListener('pointercancel', settle, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hide();

  document.addEventListener('dragstart', hide, true);

     ونحدّث سبب التعطيل الظاهر في الـTooltip. */
  new MutationObserver(list => {
    for (const m of list) { const el = m.target; if (el !== hov || pressed || !el.title) continue;

  }).observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['title'] });
})();

    '#mmEqDlg .mmEqHint{margin:0 10px 6px;font-size:11.5px;line-height:1.7;color:#666}' +
    '#mmEqDlg .mmEqHint code{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#f3f1ea;border-radius:3px;padding:0 4px;color:#333}' +
    '#mmEqDlg .mmEqF{display:flex;gap:6px;justify-content:flex-end;padding:0 8px}';
  let dlg = null, tgt = null;
  const norm = s => String(s).replace(/[\s\u00a0]+/g, ' ').trim();
  function insertAt(host, r, text, trail) {
    const ml = mathml(text); if (!ml) return false;
    const s = getSelection(); host.focus({ preventScroll: true }); s.removeAllRanges(); s.addRange(r);
    const html = '<span ' + ATTR + '="' + esc(text) + '" contenteditable="false">' + ml + '</span>' + (trail ? '&nbsp;' : '');
    let ok = false; try { ok = document.execCommand('insertHTML', false, html); } catch (_) {}   /* insertHTML = خطوة Undo أصلية للمتصفح */
    if (!ok) {

      const last = tpl.content.lastChild; rr.insertNode(tpl.content); const r2 = document.createRange(); r2.setStartAfter(last); r2.collapse(true); s.removeAllRanges(); s.addRange(r2);
      host.dispatchEvent(new Event('input', { bubbles: true }));
    }
    host.querySelectorAll('[' + ATTR + ']:not([contenteditable])').forEach(x => x.setAttribute('contenteditable', 'false'));
    return true;
  }
  function placeDlg() {
    if (!dlg || !dlg.classList.contains('show')) return;
    const vv = window.visualViewport, vw = vv ? vv.width : innerWidth, ot = vv ? vv.offsetTop : 0, ol = vv ? vv.offsetLeft : 0, w = Math.min(460, vw - 16);
    dlg.style.width = w + 'px'; dlg.style.left = Math.round(ol + (vw - w) / 2) + 'px'; dlg.style.top = Math.round(ot + 56) + 'px';
  }
  function refreshPrev() {
    const pv = dlg.querySelector('.mmEqPrev'), v = norm(dlg.querySelector('textarea').value).slice(0, MAXLEN), ml = v ? mathml(v) : '';
    pv.innerHTML = ml; pv.classList.toggle('empty', !ml);
  }
  function closeDlg() { const h = tgt && tgt.host; if (dlg) dlg.classList.remove('show'); tgt = null; if (h && h.isConnected) { try { h.focus({ preventScroll: true }); } catch (_) {} } }
  function commitDlg() {
    const t = tgt; if (!t) return; const text = norm(dlg.querySelector('textarea').value);
    closeDlg(); if (!text) return;   /* فاضي = إلغاء (المعادلة القديمة تفضل زي ما هي) */
    if (t.cb) { t.cb(text); return; }   /* Equation Box (Rich Note): الـcallback هو اللي بيضيف/بيعدّل العنصر الحر */
    if (!t.host.isConnected) return;
    if (t.ad && t.ad.add(text)) {   /* Rich Note: معادلة جديدة = عنصر حر زي الصورة؛ النص المحدد (لو كان) اتحوّل لمعادلة فبيتشال */
      if (t.delSel && t.range && !t.range.collapsed) { try { const s = getSelection(); t.host.focus({ preventScroll: true }); s.removeAllRanges(); s.addRange(t.range); document.execCommand('delete'); } catch (_) {} }
      return; }
    insertAt(t.host, t.range, text, t.trail);
  }
  function buildDlg() {
    if (dlg) return dlg;
    const st = document.createElement('style'); st.id = 'mmEqDlgCSS'; st.textContent = DCSS; document.head.appendChild(st);
    dlg = document.createElement('div'); dlg.id = 'mmEqDlg'; dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-label', 'Equation');
    dlg.innerHTML = '<div class="mmEqH"><strong>Equation</strong><button type="button" data-a="x" title="Esc" aria-label="Close">✕</button></div>' +
      '<textarea dir="ltr" lang="en" rows="2" maxlength="' + MAXLEN + '" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="F_1/A_1 = F_2/A_2"></textarea>' +
      '<div class="mmEqPrev empty" dir="ltr"></div>' +
      '<div class="mmEqHint" dir="rtl">اكتب من اليسار لليمين: <code>a/b</code> كسر · <code>x^2</code> أُس · <code>x_1</code> دليل · <code>sqrt(x)</code> جذر · <code>sum_(i=1)^n</code> · <code>a over b</code> · <code>pi</code> <code>alpha</code> · <code>%s(x)</code> شطب X · <code>%m(x)</code> شطب مائل</div>' +
      '<div class="mmEqF"><button type="button" data-a="ok">إدراج ↵</button><button type="button" data-a="x">إلغاء</button></div>';
    document.body.appendChild(dlg);
    dlg.addEventListener('pointerdown', e => e.stopPropagation());   /* ما يقفلش محرر الـNode (click-outside) */
    dlg.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); commitDlg(); } });
    dlg.addEventListener('input', refreshPrev);
    dlg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.a === 'ok') commitDlg(); else closeDlg(); });
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && dlg.classList.contains('show')) { e.stopImmediatePropagation(); e.preventDefault(); closeDlg(); } }, true);
    const vv = window.visualViewport; if (vv) { vv.addEventListener('resize', placeDlg); vv.addEventListener('scroll', placeDlg); } window.addEventListener('resize', placeDlg);
    return dlg;
  }
  /* بيفتح الخانة: تحديد → نصه | مؤشر بعد معادلة / معادلة محددة → نصها للتعديل | غير كده → فاضية */
  function openDlg() {
    const s = getSelection(); if (!s || !s.rangeCount) return false;
    let r = s.getRangeAt(0).cloneRange(); const anc = r.commonAncestorContainer, el = anc.nodeType === 1 ? anc : anc.parentElement;
    const host = el && el.closest ? el.closest('[contenteditable="true"]') : null; if (!host) return false;
    let init = '', trail = true;
    if (!r.collapsed) {
      init = selectionSource(r); const f = r.cloneContents();
      if (f.childNodes.length === 1 && f.firstChild.nodeType === 1 && f.firstChild.hasAttribute(ATTR)) trail = false;
    } else {
      const n = r.startContainer, o = r.startOffset, txt = n.nodeType === 3 ? n.data.slice(0, o) : null;
      const prev = txt === null ? n.childNodes[o - 1] : (/^[\s\u00a0]*$/.test(txt) ? n.previousSibling : null);
      if (prev && prev.nodeType === 1 && prev.hasAttribute(ATTR)) { init = prev.getAttribute(ATTR) || ''; trail = false; r = document.createRange(); r.selectNode(prev); }
    }
    buildDlg(); const ta = dlg.querySelector('textarea'), ad = window.MMEq && [window.MMEq.noteAdapter, window.MMEq.nodeAdapter].find(a => a && a.match(host));
    tgt = { host, range: r, trail, ad: (trail && ad) ? ad : null, delSel: trail && !r.collapsed && init.length <= MAXLEN };   /* trail=false ⇒ بنعدّل معادلة inline موجودة (تفضل inline) */
    ta.value = init.slice(0, MAXLEN); refreshPrev(); dlg.classList.add('show'); placeDlg();
    ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length);
    return true;
  }
  /* خانة المعادلة من غير نص محدد/Host: الـcallback بياخد النص الخطي (Equation Box في Rich Note — إضافة أو تعديل) */
  function openFor(init, cb) {
    buildDlg(); const ta = dlg.querySelector('textarea'); tgt = { host: null, range: null, trail: false, cb };
    ta.value = String(init == null ? '' : init).slice(0, MAXLEN); refreshPrev(); dlg.classList.add('show'); placeDlg();
    ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length);
    return true;
  }
  const apply = openDlg;   /* أزرار a⁄b في شريط الـNode والـRich Note */
  /* دبل كليك على معادلة (وهي في وضع التحرير) → نفس الخانة بنصها */
  document.addEventListener('dblclick', e => {
    const q = e.target && e.target.closest ? e.target.closest('[' + ATTR + ']') : null; if (!q) return;
    const host = q.parentElement && q.parentElement.closest('[contenteditable="true"]'); if (!host) return;
    e.preventDefault(); e.stopPropagation(); const s = getSelection(), r = document.createRange(); r.selectNode(q); s.removeAllRanges(); s.addRange(r); openDlg();
  }, true);
  /* Alt+Shift+E: يفتح خانة المعادلة */
  document.addEventListener('keydown', e => {
    if (!e.altKey || !e.shiftKey || e.ctrlKey || e.metaKey || e.code !== 'KeyE') return;
    if (openDlg() || (window.MMEq.noteAdapter && window.MMEq.noteAdapter.openNew())) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* ---------- المعادلة المحددة: كليك → شريط (تعديل / حذف) | سحب (Drag) → نقلها جوه نفس النص — Node + Rich Note + Chat Box ---------- */
  const BCSS = '[contenteditable="true"] [data-mmeq]{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;touch-action:none}' +
    '[data-mmeq].mmEqSel{outline:2px solid #2563eb;outline-offset:2px;background:rgba(37,99,235,.14)}[data-mmeq].mmEqLift{opacity:.3}' +
    'body.mmEqDragging,body.mmEqDragging *{cursor:grabbing!important}' +
    '#mmEqGhost{position:fixed;z-index:2660;pointer-events:none;display:none;padding:4px 8px;background:#fff;color:#222;border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:.92;direction:ltr}' +
    '#mmEqDrop{position:fixed;z-index:2660;pointer-events:none;display:none;width:2px;border-radius:1px;background:#2563eb}' +
    '#mmEqBar{position:fixed;z-index:2650;display:none;gap:3px;padding:3px;background:#fff;border:1px solid #c9c5b8;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.28);direction:ltr}#mmEqBar.show{display:flex}' +
    '#mmEqBar button{min-width:32px;height:30px;cursor:pointer;border:1px solid #c9c5b8;border-radius:6px;background:#fff;color:#222;font:15px/1 "Segoe UI",Tahoma,Arial,sans-serif}' +
    '#mmEqBar button:hover{background:#eef3ff;border-color:#8aa4e6}#mmEqBar button[data-a=del]:hover{background:#fdecec;border-color:#e08a8a}';
  if (!document.getElementById('mmEqBarCSS')) { const st = document.createElement('style'); st.id = 'mmEqBarCSS'; st.textContent = BCSS; document.head.appendChild(st); }
  let bar = null, selQ = null, drag = null, noClick = false, ghost = null, dropEl = null;
  const hostOf = q => q && q.parentElement && q.parentElement.closest('[contenteditable="true"]');
  const fireInput = h => h.dispatchEvent(new Event('input', { bubbles: true }));
  function hideBar() { if (selQ) selQ.classList.remove('mmEqSel'); selQ = null; if (bar) bar.classList.remove('show'); }
  function selectEq(q) { const s = getSelection(), r = document.createRange(); r.selectNode(q); s.removeAllRanges(); s.addRange(r); }
  function delEq(q) {
    const h = hostOf(q); hideBar(); if (!h) return;
    h.focus({ preventScroll: true }); selectEq(q); try { document.execCommand('delete'); } catch (_) {}
    if (q.isConnected) { q.remove(); fireInput(h); }
  }
  function placeBar(q) {
    const r = q.getBoundingClientRect(), vw = innerWidth, w = bar.offsetWidth || 80; let top = r.top - 38; if (top < 4) top = r.bottom + 6;
    bar.style.top = Math.round(top) + 'px'; bar.style.left = Math.round(Math.max(4, Math.min(vw - w - 4, r.left + r.width / 2 - w / 2))) + 'px';
  }
  function showBar(q) {
    if (!bar) {
      bar = document.createElement('div'); bar.id = 'mmEqBar';
      bar.innerHTML = '<button type="button" data-a="edit" title="تعديل المعادلة" aria-label="Edit equation">✎</button><button type="button" data-a="del" title="حذف المعادلة" aria-label="Delete equation">🗑</button>';
      document.body.appendChild(bar);
      bar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });   /* ما يسحبش الـfocus/الـSelection من المحرر */
      bar.addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); e.stopPropagation(); });   /* ما يقفلش محرر الـNode */
      bar.addEventListener('click', e => {
        const b = e.target.closest('button'), q = selQ; if (!b || !q || !q.isConnected) { hideBar(); return; }
        if (b.dataset.a === 'del') delEq(q);
        else { const h = hostOf(q); hideBar(); if (h) { h.focus({ preventScroll: true }); selectEq(q); openDlg(); } }
      });
    }
    if (selQ && selQ !== q) selQ.classList.remove('mmEqSel');
    selQ = q; q.classList.add('mmEqSel'); bar.classList.add('show'); placeBar(q);
  }

  /* ----- Drag: pointer events (ماوس + لمس). الإفلات بيحط المعادلة عند المؤشر (caret) تحت الإصبع، ومؤشر أزرق بيوضّح المكان ----- */
  const caretAt = (x, y) => {
    let r = null;
    if (document.caretPositionFromPoint) { const c = document.caretPositionFromPoint(x, y); if (c) { r = document.createRange(); r.setStart(c.offsetNode, c.offset); r.collapse(true); } }

    return r;
  };
  function dropAt(d, x, y) {
    let r = caretAt(x, y); if (!r) return null;
    const n = r.startContainer, el = n.nodeType === 1 ? n : n.parentElement; if (!el || !d.host.contains(el)) return null;
    if (el.closest('.mmNodeImgs2,.mmNodeBadge2')) return null;
    const eq = el.closest('[' + ATTR + ']');
    if (eq) {   /* الإفلات فوق معادلة تانية → قبلها أو بعدها حسب نص عرضها واتجاه السطر */
      if (eq === d.q) return null;
      const b = eq.getBoundingClientRect(), rtl = getComputedStyle(eq.parentElement).direction === 'rtl', before = rtl ? x > b.left + b.width / 2 : x < b.left + b.width / 2;
      r = document.createRange(); before ? r.setStartBefore(eq) : r.setStartAfter(eq); r.collapse(true);
      return { r, x: (before !== rtl) ? b.left : b.right, y: b.top, h: b.height };
    }
    const rc = r.getClientRects()[0], b = el.getBoundingClientRect();
    return { r, x: rc ? rc.left : b.left, y: rc && rc.height ? rc.top : b.top, h: rc && rc.height ? rc.height : Math.min(b.height, 24) };
  }
  function dragCleanup() {
    if (ghost) ghost.style.display = 'none'; if (dropEl) dropEl.style.display = 'none';
    document.body.classList.remove('mmEqDragging'); if (drag && drag.q) drag.q.classList.remove('mmEqLift'); drag = null;
  }
  function dragStart() {
    const d = drag; d.on = true; hideBar();
    if (!ghost) { ghost = document.createElement('div'); ghost.id = 'mmEqGhost'; document.body.appendChild(ghost); dropEl = document.createElement('div'); dropEl.id = 'mmEqDrop'; document.body.appendChild(dropEl); }
    const c = d.q.cloneNode(true); c.removeAttribute(ATTR); c.classList.remove('mmEqSel'); ghost.textContent = ''; ghost.appendChild(c); ghost.style.display = 'block';
    d.q.classList.add('mmEqLift'); document.body.classList.add('mmEqDragging'); const s = getSelection(); if (s) s.removeAllRanges();

    if (selQ && !(T && (T.closest('#mmEqBar') || T.closest('[' + ATTR + ']') === selQ))) hideBar();
    const q = T && T.closest('[' + ATTR + ']'), h = q && hostOf(q);
    if (!h || (e.button != null && e.button > 0) || q.closest('.mzCur')) return;   /* Move/Zoom ON = تنقّل بس */

  }, true);
  document.addEventListener('pointermove', e => {
    const d = drag; if (!d || e.pointerId !== d.id) return;
    if (!d.on) { if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < (d.touch ? 8 : 5)) return; dragStart(); }
    e.preventDefault();
    ghost.style.left = (e.clientX + 12) + 'px'; ghost.style.top = (e.clientY + 12) + 'px';
    d.hit = dropAt(d, e.clientX, e.clientY);
    if (d.hit) { Object.assign(dropEl.style, { display: 'block', left: Math.round(d.hit.x - 1) + 'px', top: Math.round(d.hit.y) + 'px', height: Math.max(16, Math.round(d.hit.h)) + 'px' }); } else dropEl.style.display = 'none';
  }, true);
  document.addEventListener('pointerup', e => {
    const d = drag; if (!d || e.pointerId !== d.id) return;
    const moved = d.on, hit = d.hit; dragCleanup();
    if (!moved) return;
    noClick = true; setTimeout(() => { noClick = false; }, 0);   /* الـclick اللي بييجي بعد السحب ما يعملش تحديد */
    if (hit && d.host.isConnected && d.q.isConnected) { hit.r.insertNode(d.q); d.host.normalize(); fireInput(d.host); showBar(d.q); }
  }, true);
  document.addEventListener('pointercancel', () => { if (drag) dragCleanup(); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drag && drag.on) { e.stopPropagation(); dragCleanup(); } }, true);

  document.addEventListener('click', e => {
    if (noClick) { e.stopPropagation(); e.preventDefault(); return; }
    const q = e.target && e.target.closest ? e.target.closest('[' + ATTR + ']') : null; if (q && hostOf(q)) showBar(q);
  }, true);
  document.addEventListener('keydown', e => {
    if (!selQ) return; const h = hostOf(selQ);
    if (!selQ.isConnected || !h || !h.contains(e.target)) { hideBar(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); e.stopPropagation(); delEq(selQ); }
    else if (e.key === 'Escape') hideBar();
    else if (e.key.length === 1 || e.key === 'Enter') { if (!(e.altKey && e.shiftKey)) hideBar(); }
  }, true);
  window.addEventListener('resize', hideBar); document.addEventListener('scroll', hideBar, true);

  window.MMEq = { apply, open: openDlg, openFor, mathml, fill, css: CSS, attr: ATTR, noteAdapter: null };
})();
</script>

<script>
/* تشغيل أوفلاين: بيشتغل بس لما الصفحة تتفتح من موقع (http/https). كملف محلي مش محتاج حاجة. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
